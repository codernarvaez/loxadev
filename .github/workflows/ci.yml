# Validates every PR/push. Production deploys: Firebase App Hosting (Console rollouts
# or workflow "Deploy Firebase App Hosting"). See apphosting.yaml and firebase.json.

name: CI

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Use npm 11.14 (same as Firebase App Hosting)
        run: npm install -g npm@11.14.0

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: CI=true npm test -- --watchAll=false

      - name: Production build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: build
          path: build
          if-no-files-found: error

      - name: npm audit (informational)
        run: npm audit --audit-level=high
        continue-on-error: true
